name: Linux

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

jobs:
  raku:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        raku-version:
          - '2026.07'
          - 'latest'
        include:
          - os: ubuntu-latest
            raku-version: 'latest'
            rakuast: 1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: Raku/setup-raku@v1
        with:
          raku-version: ${{ matrix.raku-version }}
      - name: Install Dependencies
        run: zef install --deps-only .
      - name: Run Tests
        run: zef test -v .
        env:
          RAKUDO_RAKUAST: ${{ matrix.rakuast }}
